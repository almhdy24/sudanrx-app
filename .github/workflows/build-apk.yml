name: Build SudanRx APK (Optimized)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build
        run: flutter clean

      - name: Build APK (release with shrinking)
        run: flutter build apk --release --split-per-abi
        # --split-per-abi produces three APKs: arm64-v8a, armeabi-v7a, x86_64.
        # Each is smaller than a universal APK. Good for distribution.

      - name: List APK files
        run: ls -la build/app/outputs/apk/release/

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: sudanrx-arm64-v8a
          path: build/app/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: sudanrx-armeabi-v7a
          path: build/app/outputs/apk/release/app-armeabi-v7a-release.apk

      - name: Upload x86_64 APK (emulators)
        uses: actions/upload-artifact@v4
        with:
          name: sudanrx-x86_64
          path: build/app/outputs/apk/release/app-x86_64-release.apk
